[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-harness"
version = "0.1.0"
description = "File-capable agent harness and versioned JEDEC-like KG prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
large = ["ijson>=3.3,<4"]
deepagents = ["deepagents>=0.4,<1", "langchain-openai>=0.3,<2"]

[project.scripts]
kg-harness = "kg_harness.cli:main"

[tool.setuptools.packages.find]
include = ["kg_harness*"]
