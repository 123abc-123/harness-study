[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-kg-harness"
version = "2.0.0"
description = "Independent internal-model agent harness, without vendor SDKs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
internal-harness = "internal_harness.cli:main"

[tool.setuptools.packages.find]
include = ["internal_harness*"]
